site_name: RePyability
site_description: Reliability engineering tools for Python
site_url: https://derrynknife.github.io/RePyability/
repo_url: https://github.com/derrynknife/RePyability
repo_name: derrynknife/RePyability

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: table
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            # The source is on GitHub: inlined, it made the page 5.7 MB.
            show_source: false
            # Each class's page lists what it inherits (RBD's methods).
            inherited_members: true
            separate_signature: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

# Formulas are typeset by MathJax (docs/javascripts/mathjax.js); diagrams
# (```mermaid blocks) by the Mermaid the theme loads.
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Broken links and anchors fail the (strict) build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

