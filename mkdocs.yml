site_name: RePyability
site_description: Reliability engineering tools for Python
site_url: https://derrynknife.github.io/RePyability/
repo_url: https://github.com/derrynknife/RePyability
repo_name: derrynknife/RePyability

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: table
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            separate_signature: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

# Broken links and anchors fail the (strict) build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - User guide:
      - Overview: guide/index.md
      - Building an RBD: guide/building.md
      - Reliability of a system: guide/reliability.md
      - Importance measures: guide/importance.md
      - Condition-based evaluation: guide/condition-based.md
      - Redundancy models: guide/redundancy-models.md
      - Common-cause failures: guide/common-cause.md
      - Repairable systems: guide/repairable.md
      - Costs: guide/costs.md
      - Design and allocation: guide/design.md
      - Maintenance policies: guide/maintenance.md
      - Saving, reproducibility and performance: guide/saving.md
  - Concepts: concepts.md
  - API reference: api.md
