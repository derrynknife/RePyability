      - 4. Which component matters?: learn/importance.md
      - 5. When redundancy disappoints: learn/dependence.md
      - 6. Repair and availability: learn/availability.md
      - 7. What it costs: learn/costs.md
      - 8. Maintaining on purpose: learn/maintenance.md
      - 9. Designing for reliability: learn/design.md
      - Glossary: learn/glossary.md
  - Tutorial: tutorial.md
  - User guide:
      - Overview: guide/index.md
      - Building an RBD: guide/building.md
      - Fault trees: guide/fault-trees.md
      - Reliability of a system: guide/reliability.md
      - Phased missions: guide/phased-missions.md
      - Networks: guide/networks.md
      - Importance measures: guide/importance.md
      - "Sensitivities: the Greeks": guide/greeks.md
      - Condition-based evaluation: guide/condition-based.md
      - Redundancy models: guide/redundancy-models.md
      - Common-cause failures: guide/common-cause.md
      - Repairable systems: guide/repairable.md
      - System capacity: guide/capacity.md
      - Costs: guide/costs.md
      - Maintaining a system: guide/system-maintenance.md
      - Spares: guide/spares.md
      - Design and allocation: guide/design.md
      - Maintenance policies: guide/maintenance.md
      - Demonstration testing: guide/demonstration.md
      - Timelines: guide/timelines.md
