name: close issues

# Close the issues a pull request into dev finishes, when it merges.
# GitHub itself closes an issue only when the pull request that says
# "Closes #N" merges into the default branch (main), which here happens
# at a release: this closes them as the work reaches dev, with a comment
# naming the pull request. It runs no tests (the one automated test run
# is actions.yml, on the pull request from dev into main).

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    name: close the issues the pull request finishes
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = pull.body || "";
            // The keywords GitHub takes, in a body line such as "Closes #N".
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = new Set();
            for (const match of body.matchAll(pattern)) {
              numbers.add(Number(match[1]));
            }
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({
                ...context.repo,
                issue_number,
              });
              if (issue.pull_request || issue.state === "closed") {
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Merged into dev by #${pull.number}: it reaches users with the next release.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${issue_number}`);
            }
