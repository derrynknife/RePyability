name: actions

run-name: RePyability CI

on: [push, pull_request]

jobs:
  lint:
    name: lint (black, isort, flake8, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: black
        run: black --check repyability

      - name: isort
        run: isort --check-only repyability

      - name: flake8
        run: flake8 repyability

      - name: mypy
        run: mypy repyability

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: pytest (under coverage)
        run: coverage run -m pytest

      - name: coverage report (enforces the fail_under gate)
        run: coverage report

      - name: coverage html
        if: matrix.python-version == '3.11'
        run: coverage html

      - name: Upload coverage html report artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/

  test-numba:
    # numba is optional, so the other jobs run without it (and test that
    # everything falls back to the Python engine); this one installs it, so
    # the compiled engine runs and its results are checked against Python's.
    name: test (with numba, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with the compiled engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,fast]
          python -c "import numba; print('numba', numba.__version__)"

      - name: pytest
        run: python -m pytest -q

  test-minimum:
    # CI otherwise installs the newest surpyval, so once surpyval releases,
    # nothing would test the oldest one pyproject.toml still allows.
    name: test (minimum surpyval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package, then the oldest surpyval it allows
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          minimum=$(python - <<'EOF'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as f:
              dependencies = tomllib.load(f)["project"]["dependencies"]
          spec = next(d for d in dependencies if d.startswith("surpyval"))
          print(re.search(r">=\s*([0-9][0-9.]*)", spec).group(1))
          EOF
          )
          pip install "surpyval==$minimum"
          python -c "import surpyval; print('surpyval', surpyval.__version__)"

      - name: pytest
        run: python -m pytest -q

  docs:
    name: docs (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package with docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build docs (strict)
        run: mkdocs build --strict
