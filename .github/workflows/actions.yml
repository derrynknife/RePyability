name: actions

run-name: RePyability CI

# The one automated test run: the full suite on a pull request into master
# (from dev). Nothing else runs it; release.yml publishes only what it
# passed.
on:
  pull_request:
    branches: [master]

jobs:
  lint:
    name: lint (black, isort, flake8, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: black
        run: black --check repyability

      - name: isort
        run: isort --check-only repyability

      - name: flake8
        run: flake8 repyability

      - name: mypy
        run: mypy repyability

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: pytest
        # Every version runs the suite on all the runner's cores; coverage is
        # measured once, on the newest Python (next step).
        if: matrix.python-version != '3.14'
        run: python -m pytest -n auto -q --durations=30

      - name: pytest (under coverage)
        # Coverage is measured on Python 3.14 alone, through sys.monitoring,
        # which is several times faster than its default tracer
        # (sys.settrace): under the tracer, Python 3.11's job took an hour.
        # pytest-cov collects it from each of pytest-xdist's workers.
        if: matrix.python-version == '3.14'
        env:
          COVERAGE_CORE: sysmon
        run: python -m pytest -n auto -q --durations=30 --cov --cov-report=

      - name: coverage report (enforces the fail_under gate)
        if: matrix.python-version == '3.14'
        run: coverage report

      - name: coverage html
        if: matrix.python-version == '3.14'
        run: coverage html

      - name: Upload coverage html report artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/

  test-numba:
    # numba is optional, so the other jobs run without it (and test that
    # everything falls back to the Python engine); this one installs it, so
    # the compiled engine runs and its results are checked against Python's.
    name: test (with numba, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with the compiled engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,fast]
          python -c "import numba; print('numba', numba.__version__)"

      - name: pytest
        run: python -m pytest -n auto -q --durations=30

  test-minimum:
    # The other jobs install the newest of every dependency, so nothing
    # else tests the oldest that pyproject.toml allows: this one installs
    # each dependency at its floor (numpy, scipy, networkx, surpyval, tqdm),
    # on the oldest Python, then the test tools.
    name: test (minimum dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package at its dependencies' floors
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e .
          uv pip install --system "pytest>=7.0" "pytest-xdist>=3.5" "pytest-timeout>=2.3"
          python -c "import numpy, scipy, networkx, surpyval, tqdm; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'networkx', networkx.__version__, 'surpyval', surpyval.__version__, 'tqdm', tqdm.__version__)"

      - name: pytest
        run: python -m pytest -n auto -q --durations=30

  docs:
    name: docs (strict build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package with docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build docs (strict)
        run: mkdocs build --strict
