[build-system]
# 77 reads the licence as an SPDX expression (PEP 639).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repyability"
dynamic = ["version"]
description = "Reliability engineering tools for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "derrynknife", email = "derrynknife@gmail.com" }]
keywords = [
    "reliability",
    "reliability-engineering",
    "reliability-block-diagram",
    "rbd",
    "survival-analysis",
    "availability",
    "maintainability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0,<3",
    # The first SciPy built for NumPy 2.
    "scipy>=1.13",
    "networkx>=3.0",
    # Deliberately uncapped: RePyability consumes a small surface of surpyval
    # (sf/ff/qf/random/mean, extras/with_params, regression sf/sf_tvc,
    # to_dict/from_dict). A surpyval release reaches every fresh install at
    # once, so the upstream workflow runs the tests against surpyval's
    # development branch to show a break before it is released. CI also tests
    # this minimum. 0.23 names the limited-failure proportion lfp_p (p goes
    # in its next release), takes success_run's level as alpha_ci, and
    # pickles its fits (for n_jobs' worker processes), as RePyability relies
    # on; 0.22 named a distribution's parameters parameter_names and
    # computes the Normal and LogNormal quantiles directly.
    "surpyval>=0.23",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# The compiled engine of RepairableRBD simulations (engine="numba", and
# engine="auto" when it pays). 0.60 is the first numba for numpy 2.
fast = ["numba>=0.60"]
dev = [
    "black==26.3.1",
    "isort>=5.12",
    "flake8>=6.0",
    "flake8-pyproject>=1.2",
    # Pinned (like black) so a new mypy release can't fail CI on code that
    # type-checks locally; bump deliberately.
    "mypy==2.3.0",
    "pytest>=7.0",
    "coverage>=7.0",
    "pre-commit>=3.0",
]
docs = [
    # MkDocs 2.0 removes the plugin system with no migration path (per the
    # mkdocs-material advisory), so hold the docs stack on the 1.x/9.x line
    # until a deliberate migration.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.0,<10",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/derrynknife/RePyability"
Documentation = "https://derrynknife.github.io/RePyability/"
Repository = "https://github.com/derrynknife/RePyability"
Issues = "https://github.com/derrynknife/RePyability/issues"

[tool.pytest.ini_options]
# Collect the unit tests and, via --doctest-modules, the runnable examples in
# the library's docstrings, so the documented examples are exercised in CI and
# cannot silently rot.
testpaths = ["repyability"]
addopts = "--doctest-modules"
# A surpyval deprecation that RePyability or its tests run into fails them
# ("... will be removed in v0.23"), so that the upstream workflow, on
# surpyval's development branch, shows it before the name is removed.
filterwarnings = [
    "error:.*will be removed in v[0-9]:DeprecationWarning:repyability",
]

[tool.setuptools.dynamic]
version = { attr = "repyability._version.__version__" }

[tool.setuptools.packages.find]
include = ["repyability*"]

# The type-checking marker, and the data the installed tests read (#167):
# test_packaging checks that every data file in the package is listed here.
[tool.setuptools.package-data]
"repyability" = ["py.typed"]
"repyability.tests" = ["*.json"]

# For Black pre-commit hook
[tool.black]
line-length = 79
# Pin the formatting target to the minimum supported Python so output does
# not depend on the interpreter black happens to run under.
target-version = ["py311"]

# So isort is compatible with black
[tool.isort]
profile = "black"
line_length = 79

# mypy
[tool.mypy]
exclude = ['repyability/tests/']

[[tool.mypy.overrides]]
module = [
    'scipy.*',
    'networkx',
    'surpyval.*',
    'tqdm',
    'numpy',
    'numpy.*',
    'numba',
    'numba.*',
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numba ships type information but sets some attributes at run time
# (numba.config.NUMBA_NUM_THREADS), and CI's lint job doesn't install it:
# check it as untyped whether it is installed or not.
module = ['numba', 'numba.*']
follow_imports = 'skip'

# Coverage
[tool.coverage.run]
source = ["repyability"]
# The compiled loop, decision diagram and random streams' Philox run as
# machine code, which coverage cannot trace (their equivalence with the
# Python code is tested instead).
omit = [
    "*/tests/*",
    "*/rbd/_kernel.py",
    "*/rbd/_bdd_kernel.py",
    "*/rbd/_philox_kernel.py",
]

[tool.coverage.report]
# The library (excluding tests) must stay above this bar.
fail_under = 80

# Flake8
[tool.flake8]
extend-ignore = ['E203', 'W503']
per-file-ignores = [
    '*/__init__.py:F401',
]
